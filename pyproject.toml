[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyst"
version = "1.0.0"
description = "Multi-engine market analysis with a transparent, auditable confidence score"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
analyst = "analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analyst = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501  line length is handled by the formatter, not by failing the build
# B008  FastAPI and Typer both rely on calls in default arguments by design
# UP042 StrEnum requires Python 3.11; this package supports 3.10, and
#       `(str, Enum)` is the portable equivalent
ignore = ["E501", "B008", "UP042"]
