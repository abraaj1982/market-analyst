# ============================================================================
#  Economic calendar without a paid subscription.
#
#  Recurring releases (NFP, CPI, PPI) follow published, stable scheduling rules
#  and are generated deterministically. FOMC meetings follow no rule, so they
#  are listed explicitly and take two minutes to refresh once a year from
#  federalreserve.gov/monetarypolicy/fomccalendars.htm
#
#  All times are UTC.
# ============================================================================

recurring:
  - id: NFP
    label: "US Non-Farm Payrolls"
    impact: high
    currency: USD
    rule: first_friday
    time_utc: "13:30"

  - id: CPI
    label: "US Consumer Price Index"
    impact: high
    currency: USD
    rule: nth_weekday           # approximately the second Wednesday
    nth: 2
    weekday: 2                  # 0=Monday ... 6=Sunday
    time_utc: "13:30"

  - id: PPI
    label: "US Producer Price Index"
    impact: medium
    currency: USD
    rule: nth_weekday
    nth: 2
    weekday: 3
    time_utc: "13:30"

  - id: JOBLESS
    label: "US Initial Jobless Claims"
    impact: low
    currency: USD
    rule: weekly
    weekday: 3                  # Thursday
    time_utc: "13:30"

  - id: RETAIL
    label: "US Retail Sales"
    impact: medium
    currency: USD
    rule: nth_weekday
    nth: 3
    weekday: 2
    time_utc: "13:30"

# Explicit dates - refresh once a year.
# The rate decision lands at 18:00 UTC and the press conference at 18:30 UTC.
fixed:
  - id: FOMC
    label: "FOMC rate decision and press conference"
    impact: high
    currency: USD
    datetimes_utc:
      - "2026-01-28 19:00"
      - "2026-03-18 18:00"
      - "2026-04-29 18:00"
      - "2026-06-17 18:00"
      - "2026-07-29 18:00"
      - "2026-09-16 18:00"
      - "2026-11-04 19:00"
      - "2026-12-16 19:00"

  - id: JACKSON_HOLE
    label: "Jackson Hole symposium"
    impact: high
    currency: USD
    datetimes_utc:
      - "2026-08-21 14:00"
