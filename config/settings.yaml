# ============================================================================
#  إعدادات محلل الأسواق — كل رقم هنا قابل للتعديل بدون لمس الكود
#  عدّل، احفظ، أعد التشغيل. النسخة تُخزَّن مع كل تحليل للتدقيق لاحقاً.
# ============================================================================
version: "1.0.0"

profile: swing            # swing | intraday | position

timezone:
  storage: UTC            # التخزين والحساب دائماً UTC — لا تغيّره
  display: Asia/Muscat    # العرض في اللوحة والتقارير

# ---------------------------------------------------------------------------
# الفريمات المستخدمة لكل ملف تعريف
# ---------------------------------------------------------------------------
profiles:
  swing:
    timeframes: ["1h", "4h", "1d"]
    mtf_weights: { "1d": 0.40, "4h": 0.38, "1h": 0.22 }
    analysis_interval_minutes: 30
  intraday:
    timeframes: ["15m", "1h", "4h"]
    mtf_weights: { "4h": 0.40, "1h": 0.38, "15m": 0.22 }
    analysis_interval_minutes: 5
  position:
    timeframes: ["1d", "1wk"]
    mtf_weights: { "1wk": 0.55, "1d": 0.45 }
    analysis_interval_minutes: 240

# ---------------------------------------------------------------------------
# أوزان المحركات — الأساس. تُعدَّل حسب نظام السوق أدناه.
# لا يُشترط أن يكون المجموع 1: التطبيع يتم رياضياً في المجمّع.
# ---------------------------------------------------------------------------
weights:
  base:
    trend:              1.00
    ict_smc:            0.85
    classic_ta:         0.70
    indicators:         0.65
    macro:              0.80
    cot:                0.45
    volume_seasonality: 0.40
    fundamentals:       0.75
    news:               0.00   # الأخبار بوابة ومُعدِّل، لا تصوّت باتجاه

  # مضاعفات حسب نظام السوق (تُضرب في الوزن الأساس)
  regime_multipliers:
    trending:
      trend: 1.25
      ict_smc: 1.10
      classic_ta: 0.85
      indicators: 0.75      # المؤشرات المتذبذبة تعطي إشارات معاكسة كاذبة في الترند
    ranging:
      trend: 0.60
      ict_smc: 0.95
      classic_ta: 1.20      # الدعم/المقاومة يتفوق في العرضي
      indicators: 1.25
    high_volatility:
      trend: 0.85
      ict_smc: 0.80
      classic_ta: 0.70
      indicators: 0.60
      macro: 1.20
    quiet:
      trend: 0.80
      ict_smc: 1.00
      classic_ta: 1.10
      indicators: 1.05

  # مضاعفات حسب فئة الأصل (الأساسيات لا معنى لها في الفوركس مثلاً)
  asset_class_multipliers:
    fx:     { fundamentals: 0.0, volume_seasonality: 0.7, macro: 1.25, cot: 1.15 }
    metal:  { fundamentals: 0.0, volume_seasonality: 0.8, macro: 1.35, cot: 1.25 }
    equity: { macro: 0.70, cot: 0.0, fundamentals: 1.25 }
    index:  { fundamentals: 0.5, cot: 0.8, macro: 1.0 }
    crypto: { fundamentals: 0.0, cot: 0.0, macro: 0.8 }

# ---------------------------------------------------------------------------
# معادلة درجة الثقة
# ---------------------------------------------------------------------------
scoring:
  direction_deadband: 0.10     # أقل من هذا = محايد
  dispersion_lambda: 0.55      # شدة عقوبة تعارض المحركات
  # التغطية: كم من الوزن المتاح أصلاً لهذا الأصل شارك فعلاً في القرار؟
  # حد مطلق للوزن لا يكفي — محرك واحد قوي قد يتجاوزه ويعطي A+ زوراً.
  min_coverage_ratio: 0.50     # 50% من الوزن المتاح على الأقل
  min_active_engines: 3        # وثلاثة محركات فعّالة على الأقل
  news_penalty_high: 0.35      # مُعدِّل الثقة عند خبر عالي الأثر قريب
  news_penalty_medium: 0.75
  # ── معايرة الإجماع → ثقة ────────────────────────────────────────────
  # الإجماع الخام S هو متوسط مرجّح، لذا يميل بنيوياً نحو الصفر: حتى إعداد
  # ممتاز نادراً ما يتجاوز |S| = 0.75. تحويل |S| مباشرة إلى نسبة مئوية يجعل
  # تصنيف A+ غير قابل للبلوغ ويُفرغ المقياس من معناه.
  # لذلك نمرّره عبر دالة لوجستية رتيبة (Platt scaling) مُطبّعة بحيث L(0)=0 و L(1)=1.
  #   midpoint = قيمة |S| التي تُعطي ثقة 50%
  #   steepness = حدّة التمييز بين الإعداد الجيد والممتاز
  #
  # القيم أدناه مقيسة تجريبياً لا مُخمّنة (90 سيناريو، راجع docs/SCORING.md):
  #   اتجاه متعدد الفريمات نظيف → |S| وسيط 0.46 (أقصى 0.53)
  #   سوق عرضي مشوّش            → |S| وسيط 0.07
  #   عشوائي واقعي              → |S| وسيط 0.17
  # وسيط 0.33 يضع الاتجاه النظيف عند ثقة ~72% (تصنيف A) والعشوائي عند ~13%.
  #
  # ⚠️ هذان الرقمان تقديران أوليان (priors) مبنيان على بيانات تركيبية — يجب
  #    إعادة معايرتهما من نتائج التتبّع الأمامي الفعلية بعد تراكم عيّنة كافية.
  calibration:
    midpoint: 0.33
    steepness: 9.5

  # مُعدِّل ملاءمة نظام السوق: هل هذا السوق أصلاً قابل للتداول بثقة؟
  # يُخفّض الثقة فقط، ولا يرفعها أبداً.
  regime_fit:
    trending: 1.00
    ranging: 0.92
    quiet: 0.88
    high_volatility: 0.82

  grades:
    A_PLUS: 0.80
    A: 0.70
    B: 0.60
    C: 0.45

# ---------------------------------------------------------------------------
# إدارة المخاطر
# ---------------------------------------------------------------------------
risk:
  atr_period: 14
  atr_stop_multiplier: 1.6
  min_risk_reward: 1.8
  target_r_multiple_1: 2.0
  target_r_multiple_2: 3.5
  account_risk_percent: 1.0
  structure_stop_buffer_atr: 0.35   # مسافة أمان خلف السوينغ بوحدات ATR
  # أقصى مسافة مقبولة للوقف. إذا كان مستوى الإبطال البنيوي أبعد من هذا،
  # فهندسة الصفقة سيئة أصلاً — يُقصّ الوقف ويُعلَن ذلك صراحة في التقرير.
  max_stop_atr: 3.0
  # لا تعرض مستويات دعم/مقاومة أبعد من هذا (ضجيج لا معنى له)
  max_level_distance_atr: 10.0

# ---------------------------------------------------------------------------
# جودة البيانات
# ---------------------------------------------------------------------------
data_quality:
  max_staleness_bars: 3        # كم شمعة يُسمح بتأخر آخر شمعة مغلقة
  max_gap_ratio: 0.08          # نسبة الشموع المفقودة المسموحة
  min_bars_required: 120
  spike_atr_multiple: 8.0      # مدى شمعة أكبر من هذا = شمعة مشبوهة

# ---------------------------------------------------------------------------
# التنبيهات
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  min_grade: "A"               # لا تنبيه لما دون هذا
  cooldown_minutes: 240        # لا تكرر نفس الرمز/الاتجاه قبل هذه المدة
  require_state_change: true   # نبّه فقط عند تغيّر الاتجاه أو الترقية لدرجة أعلى
  daily_digest_hour_local: 7   # ساعة التقرير اليومي المجمّع بتوقيت العرض

# ---------------------------------------------------------------------------
# التخزين
# ---------------------------------------------------------------------------
storage:
  database_url: "sqlite:///data/analyst.db"
  candle_retention_days: 1825  # 5 سنوات
