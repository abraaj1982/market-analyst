# ============================================================================
#  Market Analyst — every number here is editable without touching code.
#  Edit, save, restart. The version below is stamped onto every stored analysis
#  so months of accumulated statistics stay attributable.
# ============================================================================
version: "1.1.0"

profile: swing            # swing | intraday | position

timezone:
  storage: UTC            # storage and computation are always UTC - do not change
  display: Asia/Muscat    # used for the dashboard and reports

# ---------------------------------------------------------------------------
# Timeframes per profile
# ---------------------------------------------------------------------------
profiles:
  swing:
    timeframes: ["1h", "4h", "1d"]
    mtf_weights: { "1d": 0.40, "4h": 0.38, "1h": 0.22 }
    analysis_interval_minutes: 30
  intraday:
    timeframes: ["15m", "1h", "4h"]
    mtf_weights: { "4h": 0.40, "1h": 0.38, "15m": 0.22 }
    analysis_interval_minutes: 5
  position:
    timeframes: ["1d", "1wk"]
    mtf_weights: { "1wk": 0.55, "1d": 0.45 }
    analysis_interval_minutes: 240

# ---------------------------------------------------------------------------
# Engine weights. These need not sum to 1: normalisation happens in the
# aggregator, so a weight is a statement of relative importance only.
# ---------------------------------------------------------------------------
weights:
  base:
    trend:              1.00
    ict_smc:            0.85
    classic_ta:         0.70
    indicators:         0.65
    macro:              0.80
    cot:                0.45
    volume_seasonality: 0.40
    fundamentals:       0.75
    news:               0.00   # news is a gate and a modifier, never a voter
    dividends:          0.90   # manual companies only
    sentiment:          0.70   # manual companies only

  # Multipliers applied on top of the base weight, per market regime.
  regime_multipliers:
    trending:
      trend: 1.25
      ict_smc: 1.10
      classic_ta: 0.85
      indicators: 0.75      # oscillators give false counter-signals in a trend
    ranging:
      trend: 0.60
      ict_smc: 0.95
      classic_ta: 1.20      # levels dominate in a range
      indicators: 1.25
    high_volatility:
      trend: 0.85
      ict_smc: 0.80
      classic_ta: 0.70
      indicators: 0.60
      macro: 1.20
    quiet:
      trend: 0.80
      ict_smc: 1.00
      classic_ta: 1.10
      indicators: 1.05

  # Multipliers per asset class. Fundamentals mean nothing for FX; COT means
  # nothing for a single equity.
  asset_class_multipliers:
    fx:     { fundamentals: 0.0, volume_seasonality: 0.7, macro: 1.25, cot: 1.15 }
    metal:  { fundamentals: 0.0, volume_seasonality: 0.8, macro: 1.35, cot: 1.25 }
    equity: { macro: 0.70, cot: 0.0, fundamentals: 1.25 }
    index:  { fundamentals: 0.5, cot: 0.8, macro: 1.0 }
    crypto: { fundamentals: 0.0, cot: 0.0, macro: 0.8 }

# ---------------------------------------------------------------------------
# Confidence scoring
# ---------------------------------------------------------------------------
scoring:
  direction_deadband: 0.10     # below this magnitude the read is neutral
  dispersion_lambda: 0.55      # how hard engine disagreement is penalised
  news_penalty_high: 0.35      # confidence multiplier near a high-impact release
  news_penalty_medium: 0.75

  # Coverage: how much of the weight actually available for this asset took part.
  # An absolute weight floor is not enough - one strong engine can clear it and
  # produce a false A+.
  min_coverage_ratio: 0.50     # at least 50% of available weight
  min_active_engines: 3        # and at least three active engines

  # -- Consensus to confidence calibration --------------------------------
  # Raw consensus S is a weighted mean, so it is structurally compressed toward
  # zero: even an excellent setup rarely exceeds |S| = 0.75. Reading |S| directly
  # as a percentage would put A+ out of reach and make the grade scale
  # decorative. So |S| passes through a normalised logistic (Platt scaling)
  # with L(0)=0 and L(1)=1.
  #
  # The values below were MEASURED, not guessed (90 scenarios, see docs/SCORING.md):
  #   clean multi-timeframe trend  -> median |S| 0.46 (max 0.53)
  #   choppy range                 -> median |S| 0.07
  #   realistic random walk        -> median |S| 0.17
  # A midpoint of 0.33 puts a clean trend near 72% confidence (grade A) and a
  # random walk near 13%.
  #
  # WARNING: these are priors fitted on synthetic data. Re-fit them from real
  # forward-test outcomes once enough signals have resolved: `analyst calibrate`.
  calibration:
    midpoint: 0.33
    steepness: 9.5

  # Regime fit: is this environment tradeable with confidence at all?
  # Reduces confidence only, never raises it.
  regime_fit:
    trending: 1.00
    ranging: 0.92
    quiet: 0.88
    high_volatility: 0.82

  grades:
    A_PLUS: 0.80
    A: 0.70
    B: 0.60
    C: 0.45

# ---------------------------------------------------------------------------
# Risk management
# ---------------------------------------------------------------------------
risk:
  atr_period: 14
  atr_stop_multiplier: 1.6
  min_risk_reward: 1.8
  target_r_multiple_1: 2.0
  target_r_multiple_2: 3.5
  account_risk_percent: 1.0
  structure_stop_buffer_atr: 0.35   # buffer behind the swing, in ATR units
  # Furthest a stop may sit. If structural invalidation is beyond this, the
  # trade geometry is poor: the stop is capped and the report says so openly.
  max_stop_atr: 3.0
  # Support and resistance further away than this are historical artefacts, not
  # levels; they are not displayed or scored.
  max_level_distance_atr: 10.0

# ---------------------------------------------------------------------------
# Data quality
# ---------------------------------------------------------------------------
data_quality:
  max_staleness_bars: 3        # how late the newest closed bar may be
  max_gap_ratio: 0.08          # tolerated share of missing bars
  min_bars_required: 120
  spike_atr_multiple: 8.0      # a bar range beyond this is a suspected bad tick

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  min_grade: "A"               # nothing below this is ever alerted
  cooldown_minutes: 240        # never repeat the same symbol inside this window
  require_state_change: true   # only speak again on a flip or an upgrade
  daily_digest_hour_local: 7   # local hour for the daily digest

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  database_url: "sqlite:///data/analyst.db"
  candle_retention_days: 1825  # 5 years of intraday; daily bars are kept forever
