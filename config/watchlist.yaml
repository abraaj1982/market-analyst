# ============================================================================
#  Watchlist — normally the only file you need to edit.
#  Add or remove symbols, then restart. The system fetches data itself; there
#  is no manual copying of prices anywhere.
#
#  Companies with no price feed at all (Muscat Stock Exchange and similar) are
#  NOT listed here. They live in the manual companies register instead, which
#  is managed from the dashboard — see docs/MSX.md.
# ============================================================================

instruments:

  # ---------------- Metals and FX (24/5) ----------------
  - symbol: XAUUSD
    name: "Gold / US Dollar"
    market: global_fx
    asset_class: metal
    provider_symbol: "GC=F"          # COMEX gold futures: deepest liquidity, cleanest history
    fallback_symbols: ["XAUUSD=X", "GLD"]
    price_decimals: 2

  - symbol: XAGUSD
    name: "Silver / US Dollar"
    market: global_fx
    asset_class: metal
    provider_symbol: "SI=F"
    fallback_symbols: ["XAGUSD=X"]
    price_decimals: 3

  - symbol: EURUSD
    name: "Euro / US Dollar"
    market: global_fx
    asset_class: fx
    provider_symbol: "EURUSD=X"
    price_decimals: 5

  - symbol: GBPUSD
    name: "British Pound / US Dollar"
    market: global_fx
    asset_class: fx
    provider_symbol: "GBPUSD=X"
    price_decimals: 5

  - symbol: USDJPY
    name: "US Dollar / Japanese Yen"
    market: global_fx
    asset_class: fx
    provider_symbol: "USDJPY=X"
    price_decimals: 3

  # ---------------- US indices ----------------
  - symbol: SPX
    name: "S&P 500"
    market: us
    asset_class: index
    provider_symbol: "^GSPC"
    price_decimals: 2

  - symbol: NDX
    name: "Nasdaq 100"
    market: us
    asset_class: index
    provider_symbol: "^NDX"
    price_decimals: 2

  # ---------------- US equities ----------------
  - symbol: AAPL
    name: "Apple Inc."
    market: us
    asset_class: equity
    provider_symbol: "AAPL"

  - symbol: NVDA
    name: "NVIDIA Corporation"
    market: us
    asset_class: equity
    provider_symbol: "NVDA"
