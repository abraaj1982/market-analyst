# ============================================================================
#  قائمة المتابعة — هذا هو الملف الوحيد الذي تحتاج تعديله عادة.
#  أضف أو احذف رموزاً ثم أعد التشغيل. النظام يقرأ البيانات مباشرة، لا نسخ يدوي.
# ============================================================================

instruments:

  # ---------------- المعادن والفوركس (24/5) ----------------
  - symbol: XAUUSD
    name_ar: "الذهب / الدولار"
    market: global_fx
    asset_class: metal
    provider_symbol: "GC=F"          # عقود الذهب COMEX — أعمق سيولة وأنظف تاريخ
    fallback_symbols: ["XAUUSD=X", "GLD"]
    price_decimals: 2

  - symbol: XAGUSD
    name_ar: "الفضة / الدولار"
    market: global_fx
    asset_class: metal
    provider_symbol: "SI=F"
    fallback_symbols: ["XAGUSD=X"]
    price_decimals: 3

  - symbol: EURUSD
    name_ar: "اليورو / الدولار"
    market: global_fx
    asset_class: fx
    provider_symbol: "EURUSD=X"
    price_decimals: 5

  - symbol: GBPUSD
    name_ar: "الجنيه / الدولار"
    market: global_fx
    asset_class: fx
    provider_symbol: "GBPUSD=X"
    price_decimals: 5

  - symbol: USDJPY
    name_ar: "الدولار / الين"
    market: global_fx
    asset_class: fx
    provider_symbol: "USDJPY=X"
    price_decimals: 3

  # ---------------- المؤشرات الأمريكية ----------------
  - symbol: SPX
    name_ar: "مؤشر ستاندرد آند بورز 500"
    market: us
    asset_class: index
    provider_symbol: "^GSPC"
    price_decimals: 2

  - symbol: NDX
    name_ar: "مؤشر ناسداك 100"
    market: us
    asset_class: index
    provider_symbol: "^NDX"
    price_decimals: 2

  # ---------------- أسهم أمريكية ----------------
  - symbol: AAPL
    name_ar: "آبل"
    market: us
    asset_class: equity
    provider_symbol: "AAPL"

  - symbol: NVDA
    name_ar: "إنفيديا"
    market: us
    asset_class: equity
    provider_symbol: "NVDA"

  # ---------------- السوق العماني (يومي فقط — مصدر تجريبي) ----------------
  # ملاحظة: بيانات MSX غير متاحة عبر API مجاني موثوق.
  # النظام يخزّن ما يجمعه يومياً ويبني التاريخ تراكمياً، ويعطّل تلقائياً
  # المحركات التي لا تكفيها البيانات بدل إخراج تحليل وهمي.
  - symbol: BKMB
    name_ar: "بنك مسقط"
    market: msx
    asset_class: equity
    provider_symbol: "BKMB"
    currency: OMR
    supported_timeframes: ["1d", "1wk"]
    shortable: false
    price_decimals: 3
    enabled: false        # فعّلها بعد ربط مصدر بيانات MSX (راجع docs/MSX.md)
